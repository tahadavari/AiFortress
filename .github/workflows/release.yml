name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build AiFortress.sln -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/AiFortress.Tests -c Release --no-build
      - name: Package the tagged version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./scripts/publish.ps1 -Version $env:GITHUB_REF_NAME.Substring(1) -OutputDirectory artifacts/release
      - name: Smoke test the installer
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./scripts/smoke-installer.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: windows-release
          path: |
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="AiFortress-$version-setup-win-x64.exe"
          portable="AiFortress-$version-portable-win-x64.exe"
          (cd dist && sha256sum --strict --check SHA256SUMS.txt)
          flags=(--verify-tag --generate-notes)
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            "dist/$installer#Windows x64 installer" "dist/$portable#Windows x64 portable" "dist/SHA256SUMS.txt"
